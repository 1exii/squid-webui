# Transparent Squid Proxy - Redirected Hosts
# Format: IP_ADDRESS HOSTNAME [no_quic] [no_vpn]
# no_quic rejects UDP/443 so HTTP/3 falls back through Squid.
# no_vpn blocks the Cloudflare WARP endpoints supported by the router script.

192.0.2.20 ubuntu-client no_quic no_vpn
192.0.2.21 windows-client no_quic no_vpn
